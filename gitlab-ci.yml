stages:
  - test
  - deploy

default:
  image: python:3.12-slim
  before_script:
    - python -m pip install --disable-pip-version-check -r requirements-docs.txt

verify-docs:
  stage: test
  script:
    - python -m unittest discover -s tests -v
    - python scripts/check_documentation.py
    - python -m doctest server.py samples/client.py
    - python -m sphinx -W --keep-going -n -b doctest docs/source .build/doctest
    - python -m sphinx -W --keep-going -n -b html docs/source .build/html
  artifacts:
    when: always
    paths:
      - .build/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

deploy-pages:
  stage: deploy
  needs:
    - verify-docs
  script:
    - python -m sphinx -W --keep-going -n -b html docs/source public
  pages:
    publish: public
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
